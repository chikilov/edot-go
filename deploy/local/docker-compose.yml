# Based on elastic/start-local (Apache-2.0), adapted for a loopback-only Basic-license test stack.
name: edot-go-local
configs:
  # This is the minimal yaml configuration needed to listen on all interfaces
  # for OTLP logs, metrics and traces, exporting to Elasticsearch.
  edot-collector-config:
    content: |
      extensions:
        file_storage:
          directory: /usr/share/elastic-agent/data/export-queue
          create_directory: true
          fsync: true
        apmconfig:
          source:
            elasticsearch:
              cache_duration: 10s
          opamp:
            protocols:
              http:
                endpoint: 0.0.0.0:4320
      receivers:
        # Receives data from other Collectors in Agent mode
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317 # Listen on all interfaces
            http:
              endpoint: 0.0.0.0:4318 # Listen on all interfaces

      connectors:
        elasticapm: {} # Elastic APM Connector

      processors:
        batch:
          send_batch_size: 1000
          timeout: 1s
          send_batch_max_size: 1500
        batch/metrics:
          send_batch_max_size: 0 # Explicitly set to 0 to avoid splitting metrics requests
          timeout: 1s
        elasticapm: {}

      exporters:
        debug: {}
        elasticsearch/otel:
          endpoints:
            - http://elasticsearch:9200
          user: elastic
          sending_queue:
            enabled: true
            storage: file_storage
            queue_size: 1000
          retry:
            enabled: true
            max_retries: 60
            initial_interval: 1s
            max_interval: 30s
            retry_on_status: [429, 502, 503, 504]
          mapping:
            mode: otel

      service:
        telemetry:
          metrics:
            level: normal
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
        extensions: [ apmconfig, file_storage ]
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [batch/metrics]
            exporters: [debug, elasticsearch/otel]
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug, elasticapm, elasticsearch/otel]
          traces:
            receivers: [otlp]
            processors: [batch, elasticapm]
            exporters: [debug, elasticapm, elasticsearch/otel]
          metrics/aggregated-otel-metrics:
            receivers:
              - elasticapm
            processors: [] # No processors defined in the original for this pipeline
            exporters:
              - debug
              - elasticsearch/otel

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_LOCAL_VERSION}
    container_name: ${ES_LOCAL_CONTAINER_NAME}
    volumes:
      - dev-elasticsearch:/usr/share/elasticsearch/data
    ports:
      - 127.0.0.1:${ES_LOCAL_PORT}:9200
    extra_hosts:
      - host.docker.internal:host-gateway
      - model-runner.docker.internal:host-gateway
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD_FILE=/run/secrets/elastic-password
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - xpack.ml.use_auto_machine_memory_percent=true
      - ES_JAVA_OPTS=${ES_LOCAL_JAVA_OPTS}
      - cluster.routing.allocation.disk.watermark.low=${ES_LOCAL_DISK_SPACE_REQUIRED}
      - cluster.routing.allocation.disk.watermark.high=${ES_LOCAL_DISK_SPACE_REQUIRED}
      - cluster.routing.allocation.disk.watermark.flood_stage=${ES_LOCAL_DISK_SPACE_REQUIRED}
      - "_JAVA_OPTIONS=-XX:UseSVE=0"
    secrets: [elastic-password, elastic-netrc]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --noproxy '*' --output /dev/null --silent --head --fail --netrc-file /run/secrets/elastic-netrc http://elasticsearch:9200",
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana_settings:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_LOCAL_VERSION}
    container_name: ${KIBANA_LOCAL_SETTINGS_CONTAINER_NAME}
    restart: 'no'
    secrets: [elastic-netrc, kibana-password-json]
    command: >
      bash -c '
        echo "Setup the kibana_system password";
        start_time=$$(date +%s);
        timeout=60;
        until curl --noproxy "*" -fsS --netrc-file /run/secrets/elastic-netrc -X POST http://elasticsearch:9200/_security/user/kibana_system/_password --data-binary @/run/secrets/kibana-password-json -H "Content-Type: application/json" | grep -q "^{}"; do
          if [ $$(($$(date +%s) - $$start_time)) -ge $$timeout ]; then
            echo "Error: Elasticsearch timeout";
            exit 1;
          fi;
          sleep 2;
        done;
      '

  kibana:
    depends_on:
      kibana_settings:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${ES_LOCAL_VERSION}
    container_name: ${KIBANA_LOCAL_CONTAINER_NAME}
    secrets:
      - source: kibana-config
        target: /usr/share/kibana/config/kibana.yml
    volumes:
      - dev-kibana:/usr/share/kibana/data
      - ./config/telemetry.yml:/usr/share/kibana/config/telemetry.yml
    ports:
      - 127.0.0.1:${KIBANA_LOCAL_PORT}:5601
    extra_hosts:
      - host.docker.internal:host-gateway
      - model-runner.docker.internal:host-gateway
    environment:
      - SERVER_NAME=kibana
      - TELEMETRY_ENABLED=false
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PUBLICBASEURL=http://localhost:${ES_LOCAL_PORT}
      - MONITORING_UI_CONTAINER_ELASTICSEARCH_ENABLED=true
      - XPACK_SPACES_DEFAULTSOLUTION=oblt
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --noproxy '*' -s -I http://kibana:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  collector-queue-init:
    image: docker.elastic.co/elastic-agent/elastic-otel-collector:${ES_LOCAL_VERSION}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1000:1000 /queue && chmod 0700 /queue"]
    restart: 'no'
    volumes:
      - dev-collector-queue:/queue

  edot-collector:
    image: docker.elastic.co/elastic-agent/elastic-otel-collector:${ES_LOCAL_VERSION}
    container_name: ${EDOT_LOCAL_CONTAINER_NAME}
    depends_on:
      collector-queue-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    command: [
      "--config=/etc/otelcol-contrib/config.yaml",
      "--config=/run/secrets/collector-auth",
    ]
    secrets: [collector-auth]
    volumes:
      - dev-collector-queue:/usr/share/elastic-agent/data/export-queue
    configs:
      - source: edot-collector-config
        target: /etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"  # grpc
      - "127.0.0.1:4318:4318"  # http
      - "127.0.0.1:4320:4320"  # opamp
      - "127.0.0.1:8888:8888"  # Collector metrics
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -n > /dev/tcp/127.0.0.1/4317'"]
      retries: 300
      interval: 1s
secrets:
  elastic-password:
    file: ./.env.secrets/elastic-password
  elastic-netrc:
    file: ./.env.secrets/elastic-netrc
  kibana-password-json:
    file: ./.env.secrets/kibana-password-json
  kibana-config:
    file: ./.env.secrets/kibana-config
  collector-auth:
    file: ./.env.secrets/collector-auth

volumes:
  dev-elasticsearch:
  dev-kibana:
  dev-collector-queue:
