name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Verify dependencies
        run: |
          go mod tidy -diff
          go mod verify
      - name: Validate local stack configuration
        if: runner.os == 'Linux'
        run: |
          python3 deploy/local/prepare.py
          python3 -m py_compile deploy/local/prepare.py deploy/local/verify.py
          docker compose --project-directory deploy/local config --quiet
          git check-ignore deploy/local/.env
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out -timeout=3m ./...
      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ runner.os }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  benchmark:
    name: Stack benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure stack processing
        run: go test -run '^$' -bench '^BenchmarkStackProcessor$' -benchmem -benchtime=200ms -count=3 -cpu=1,4 > benchmark.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-benchmarks
          path: benchmark.txt
          retention-days: 14
